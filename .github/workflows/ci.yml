name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q conductor scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Public safety scan
        run: python scripts/public_safety_scan.py
      - name: Docs link integrity
        run: python scripts/check_docs_links.py
      - name: Entrypoint smoke
        run: python scripts/core_entrypoint_smoke.py
      - name: Diff hygiene
        run: git diff --check

  release-gate:
    name: Deterministic release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Static release gate
        run: python conductor/release_reviewer.py .
